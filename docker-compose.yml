name: servarr
services:
  jelly-notify:
    image: ghcr.io/wagchi22/jelly-notify:latest
    container_name: jelly-notify
    init: true
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - find /app/.wwebjs_auth -name 'Singleton*' -delete; exec docker-entrypoint.sh "$@"
      - --
    command: ["node", "src/index.js"]
    env_file:
      - .env
    environment:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_NO_SANDBOX: "1"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - jelly-notify:/app/.wwebjs_auth
      - jelly-notify:/app/.wwebjs_cache

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent:/config
      - "E:/data:/data"
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: always

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - prowlarr:/config
    ports:
      - 9696:9696
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - sonarr:/config
      - "E:/data:/data"
    ports:
      - 8989:8989
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - radarr:/config
      - "E:/data:/data"
    ports:
      - 7878:7878
    restart: always

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - jellyfin:/config
      - "E:/data:/data"
    ports:
      - 8096:8096
    restart: always

volumes:
  jelly-notify:
    name: jelly-notify
    external: true
  qbittorrent:
    name: qbittorrent
    external: true
  prowlarr:
    name: prowlarr
    external: true
  sonarr:
    name: sonarr
    external: true
  radarr:
    name: radarr
    external: true
  jellyfin:
    name: jellyfin
    external: true